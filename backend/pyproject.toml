[project]
name = "infrawatch-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "psutil==7.2.2", "psycopg[binary]==3.3.6", "SQLAlchemy==2.0.54", "alembic==1.20.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.13.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
